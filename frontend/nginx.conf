# Servidor da tela no Docker Compose (docs/DECISOES.md §38). Faz o papel que o Vite faz em
# desenvolvimento: entrega a tela pronta (dist/) e repassa /api para o backend na mesma origem,
# sem CORS. Os headers ficam só no nível do server: um add_header dentro de location apagaria estes.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Não mostra a versão do nginx nas páginas de erro nem no header Server.
    server_tokens off;

    # A pergunta tem no máximo 500 caracteres: um corpo maior que isso não vem da tela.
    client_max_body_size 16k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # DNS interno do Docker: "backend" é resolvido de novo a cada 10 s. Assim o nginx sobe mesmo antes
    # do backend e encontra o container novo depois de um restart (o IP muda).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ^~: caminhos da API não passam pela regra dos arquivos com ponto lá embaixo.
    location ^~ /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Progresso (NDJSON, F3d): cada etapa sai na hora. A API já manda X-Accel-Buffering: no no
        # fluxo; aqui vale para todas as rotas.
        proxy_buffering off;
        # Rotas sem progresso esperam a pergunta inteira (ORCAMENTO_S=150 + a última rodada); a com
        # progresso manda um batimento a cada 15 s e nunca fica parada tanto tempo.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # O Vite põe um hash no nome dos arquivos de assets/: conteúdo novo, nome novo. Cache longo.
    location /assets/ {
        expires max;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        try_files $uri =404;
    }

    # index.html é sempre conferido de novo (Cache-Control: no-cache): depois de um build novo, o
    # navegador recebe os nomes novos dos assets.
    location / {
        expires -1;
        try_files $uri /index.html;
    }

    # Nada que começa com ponto (.env, .git, .npmrc...) sai daqui, mesmo que entre na imagem por engano.
    location ~ /\. {
        return 404;
    }
}
