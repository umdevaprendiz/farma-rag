services:
  # PostgreSQL 17 com a extensão pgvector já instalada (imagem mantida pelo projeto pgvector).
  # No Windows nativo o pgvector precisa ser compilado com Visual Studio; o container evita isso.
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_NAME:-farmarag}
      POSTGRES_USER: ${DB_USER:-farmarag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      # Exposta no host para a ingestão e o benchmark (que rodam fora do Docker).
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Dentro do Compose o banco é o serviço "db" e o Ollama está no host.
      DB_HOST: db
      DB_PORT: "5432"
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Bulas e trechos a API lê do banco; daqui ela só lê o catálogo de nomes (medicamentos
      # conhecidos, catálogo da ANVISA, aliases ignorados). Só leitura.
      - ./data:/srv/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Tela: o nginx entrega o build do React e repassa /api para o backend (mesma origem, sem CORS).
  # http://127.0.0.1:8080. Só no 127.0.0.1, como as outras portas: ninguém da rede acessa.
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
