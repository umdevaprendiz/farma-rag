services:
  # PostgreSQL 17 com a extensão pgvector já instalada (imagem mantida pelo projeto pgvector).
  # No Windows nativo o pgvector precisa ser compilado com Visual Studio; o container evita isso.
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # Nenhum processo do container ganha privilégio novo (o PostgreSQL troca de usuário por setuid na entrada,
    # que isto não impede). Mais que isso (cap_drop, read_only) exige ajustes finos na imagem do banco.
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${DB_NAME:-farmarag}
      POSTGRES_USER: ${DB_USER:-farmarag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      # Exposta no host para a ingestão e o benchmark (que rodam fora do Docker). Só no 127.0.0.1.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Containers da API e da tela (docs/DECISOES.md §44): sem root, raiz do sistema de arquivos somente leitura
  # (só /tmp, em memória, é gravável), sem nenhuma capability do Linux, sem ganhar privilégio e com teto de
  # memória e de processos. O que a aplicação precisa gravar está no PostgreSQL, não no disco do container.
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro do Compose o banco é o serviço "db" e o Ollama está no host.
      DB_HOST: db
      DB_PORT: "5432"
      OLLAMA_URL: http://host.docker.internal:11434
      # O LangGraph vem do ecossistema LangChain, que sabe enviar rastros ao serviço LangSmith (nuvem) se
      # estas variáveis ligarem. Desligadas de propósito: nada da pergunta sai da máquina (docs/SEGURANCA.md).
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Bulas e trechos a API lê do banco; daqui ela só lê o catálogo de nomes (medicamentos
      # conhecidos, catálogo da ANVISA, aliases ignorados). Só leitura.
      - ./data:/srv/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy

  # Carga do acervo no banco (docs/DECISOES.md §40): lê do Git as bulas em JSON, o chunks.jsonl e o cache
  # de embeddings (§39) e grava no "db". Não usa o Ollama nem os PDFs, e dispensa Python no Windows.
  # Só roda quando chamada: docker compose run --rm carga (depois, reinicie o backend se ele já estava de pé).
  carga:
    build: ./backend
    profiles: ["carga"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - ./data:/srv/data:ro
      - ./ingestion:/srv/ingestion:ro
    command: ["python", "-m", "ingestion.load_database"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy

  # Tela: o nginx (sem privilégios, porta 8080 por dentro) entrega o build do React e repassa /api para o
  # backend (mesma origem, sem CORS). http://127.0.0.1:8080. Só no 127.0.0.1, como as outras portas.
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
